<body>
<div id="paper"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="wc" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
    <feColorMatrix in="g" type="matrix" values="0 0 0 0 .3  0 0 0 0 .22  0 0 0 0 .12  .9 0 0 0 -.3" result="ga"/>
    <feComposite in="ga" in2="d" operator="in" result="gi"/>
    <feMorphology in="d" operator="erode" radius="1.6" result="er"/>
    <feComposite in="d" in2="er" operator="out" result="edge"/>
    <feColorMatrix in="edge" type="matrix" values=".55 0 0 0 0  0 .5 0 0 0  0 0 .45 0 0  0 0 0 .55 0" result="edgeD"/>
    <feMerge><feMergeNode in="d"/><feMergeNode in="edgeD"/><feMergeNode in="gi"/></feMerge>
  </filter>
  <filter id="wcEdge" x="-2%" y="-20%" width="104%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<!-- ============ Startbildschirm ============ -->
<section id="start" class="screen">
  <div id="startMain" class="st-page">
    <button class="st-who" id="startWho" type="button" aria-label="Wer spielt? Kind wechseln"></button>
    <div class="startart" id="startArt"></div>
    <h1>Dino-Inselwelt</h1>
    <p class="sub">Wer bist du? Such dir eine Forscherin oder einen Forscher aus!</p>
    <div class="avatars" id="avatarPick"></div>
    <button class="btn big go" id="startGo" type="button"></button>
    <p style="margin-top:16px"><button class="btn ghost" id="startSound" type="button"></button></p>
  </div>
  <div id="whoPage" class="st-page" hidden></div>
  <div id="makerPage" class="st-page mk" hidden></div>
</section>

<!-- ============ Inselkarte ============ -->
<section id="world" class="screen" hidden>
  <canvas id="worldCanvas" aria-label="Inselkarte. Tippe auf einen Ort, um hinzulaufen."></canvas>
  <div class="hud tl"><div class="logo">Dino-Inselwelt<small>Tippe auf einen Ort!</small></div></div>
  <div class="hud tr">
    <div class="stars" id="hudStars"></div>
    <button class="ibtn" id="btnBag" type="button" aria-label="Rucksack"></button>
    <button class="ibtn" id="btnSound" type="button" aria-label="Ton an oder aus"></button>
    <button class="ibtn" id="btnMusic" type="button" aria-label="Musik an oder aus"></button>
    <button class="ibtn" id="btnParents" type="button" aria-label="Elternbereich (gedrückt halten)"></button>
  </div>
  <div class="hud bl">
    <button class="ibtn" id="btnWhere" type="button" aria-label="Wo bin ich?"></button>
    <button class="ibtn" id="btnMap" type="button" aria-label="Ganze Karte"></button>
  </div>
  <div class="hud br">
    <button class="ibtn" id="btnZoomOut" type="button" aria-label="Weiter weg">−</button>
    <button class="ibtn" id="btnZoomIn" type="button" aria-label="Näher heran">+</button>
  </div>
  <div class="bubble" id="bubble"><div class="who" id="bubbleWho"></div><p id="bubbleText"></p></div>
  <div class="spot card" id="spot" hidden></div>
</section>

<!-- ============ Station ============ -->
<section id="station" class="screen" hidden>
  <div class="paperbg"></div>
  <header class="sbar">
    <button class="btn ghost home" id="btnHome" type="button"><span id="homeIcon"></span>Zur Insel</button>
    <h1 id="stationTitle"></h1>
    <button class="ibtn" id="btnSay" type="button" aria-label="Nochmal vorlesen"></button>
  </header>
  <main id="stationRoot"></main>
</section>
